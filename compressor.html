<div class="card">
    <h2>ما هو الكباس؟</h2>
    <p>
        الكباس هو قلب التكييف، وظيفته سحب غاز الفريون البارد من المبخر
        وضغطه ليصبح غازًا ساخنًا وعالي الضغط ثم دفعه إلى المكثف.
    </p>

    <h2>أشهر أعطال الكباس</h2>
    <ul>
        <li>فصل الأوفرلود.</li>
        <li>ضعف الضغط.</li>
        <li>احتراق ملفات الكباس.</li>
        <li>عدم بدء التشغيل.</li>
    </ul>
</div>
