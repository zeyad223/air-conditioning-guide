<div class="card">
    <h2>ما هو المبخر؟</h2>
    <p>
        المبخر موجود داخل الوحدة الداخلية، ووظيفته امتصاص حرارة الغرفة
        وتحويل الفريون من سائل منخفض الضغط إلى غاز منخفض الضغط.
    </p>

    <h2>أشهر أعطال المبخر</h2>
    <ul>
        <li>اتساخ المبخر.</li>
        <li>تكون الثلج.</li>
        <li>ضعف دفع الهواء.</li>
        <li>تسريب مياه.</li>
    </ul>
