<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تشخيص أعطال التكييف - موسوعة التكييف العربي</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>تشخيص أعطال التكييف</h1>

<p>
اختر العطل لمعرفة الأسباب المحتملة وطريقة الفحص
</p>

</header>



<section class="cards">



<div class="card">

<div class="card-icon">
🔍
</div>


<div class="card-content">


<h2>
اختيار العطل
</h2>


<select id="faultSelect" onchange="showFault()">

<option value="">
اختر العطل
</option>

<option value="cooling">
لا يوجد تبريد
</option>

<option value="outdoor">
الوحدة الخارجية لا تعمل
</option>

<option value="indoor">
الوحدة الداخلية لا تعمل
</option>

<option value="evaporator">
تجمد المبخر
</option>

<option value="discharge">
ثلج على خط الطرد
</option>

<option value="suction">
ثلج على خط السحب
</option>

<option value="insidefan">
المروحة الداخلية لا تعمل
</option>

<option value="outsidefan">
المروحة الخارجية لا تعمل
</option>

</select>


</div>

</div>




<div class="card" id="faultResult">


<div class="card-icon">
🛠️
</div>


<div class="card-content">

<h2>
النتيجة
</h2>


<p>
اختر العطل من القائمة لعرض الأسباب.
</p>


</div>


</div>



</section>




<script>


function showFault(){


let fault =
document.getElementById("faultSelect").value;


let result =
document.getElementById("faultResult");



let faults = {


cooling:`

<div class="card-icon">
❄️
</div>

<div class="card-content">

<h2>
لا يوجد تبريد
</h2>

<p>

الأسباب المحتملة:
<br><br>

- نقص شحنة الفريون.
<br>
- الكباس لا يعمل.
<br>
- سدد في مواسير الجهاز.

<br><br>

الفحص:
<br>

- قياس ضغط الفريون.
<br>
- التأكد من تشغيل الكباس.
<br>
- فحص دائرة التبريد.

</p>

</div>

`,



outdoor:`

<div class="card-icon">
🔥
</div>

<div class="card-content">

<h2>
الوحدة الخارجية لا تعمل
</h2>

<p>

الأسباب المحتملة:
<br><br>

- تلف كابل الكنترول.
<br>
- تلف مكثف الكباس.
<br>
- تلف الكونتاكتور.
<br>
- تلف ريلاي الكارتة.
<br>
- عطل حساس الحرارة.
<br>
- عطل حساس الوحدة الخارجية.

<br><br>

الفحص:
<br>

فحص الكهرباء والتوصيلات والريلايات والحساسات.

</p>

</div>

`,



indoor:`

<div class="card-icon">
🌬️
</div>

<div class="card-content">

<h2>
الوحدة الداخلية لا تعمل
</h2>

<p>

الأسباب المحتملة:
<br><br>

- تلف الفيوز.
<br>
- تلف الكارتة الداخلية.
<br>
- عدم وصول الكهرباء.

<br><br>

الفحص:
<br>

التأكد من مصدر الكهرباء وفحص البوردة.

</p>

</div>

`,



evaporator:`

<div class="card-icon">
🧊
</div>

<div class="card-content">

<h2>
تجمد المبخر
</h2>

<p>

الأسباب المحتملة:
<br><br>

- ضعف سرعة المروحة.
<br>
- انسداد الفلاتر.
<br>
- انسداد زعانف المبخر.
<br>
- سدد في مواسير الجهاز.

<br><br>

الحل:
<br>

تنظيف الوحدة وفحص حركة الهواء ودائرة التبريد.

</p>

</div>

`,



discharge:`

<div class="card-icon">
🧊
</div>

<div class="card-content">

<h2>
ثلج على خط الطرد
</h2>

<p>

الأسباب المحتملة:
<br><br>

- نقص شحنة الفريون.
<br>
- تفويت في الكباس.

<br><br>

الفحص:
<br>

قياس ضغط التشغيل واختبار كفاءة الكباس.

</p>

</div>

`,



suction:`

<div class="card-icon">
🧊
</div>

<div class="card-content">

<h2>
ثلج على خط السحب
</h2>

<p>

الأسباب المحتملة:
<br><br>

- سرعة المروحة الداخلية ضعيفة أو لا تعمل.
<br>
- انسداد فلاتر الوحدة الداخلية.
<br>
- انسداد زعانف الكويل الداخلي.
<br>
- خفس في المواسير.
<br>
- سدد في المواسير.

<br><br>

الحل:
<br>

فحص الهواء والمواسير ودائرة التبريد.

</p>

</div>

`,



insidefan:`

<div class="card-icon">
🌀
</div>

<div class="card-content">

<h2>
المروحة الداخلية لا تعمل
</h2>

<p>

الأسباب المحتملة:
<br><br>

- مكثف الماتور.
<br>
- الكارتة لا تخرج كهرباء للماتور.
<br>
- تلف موتور المروحة.

<br><br>

الفحص:
<br>

قياس المكثف وفحص خرج الكارتة.

</p>

</div>

`,



outsidefan:`

<div class="card-icon">
🌀
</div>

<div class="card-content">

<h2>
المروحة الخارجية لا تعمل
</h2>

<p>

الأسباب المحتملة:
<br><br>

- ريلاي الكارتة الخاص بالمروحة الخارجية.
<br>
- طرف كنترول التوصيل.
<br>
- مكثف المروحة.
<br>
- تلف موتور المروحة.

<br><br>

الفحص:
<br>

فحص الريلاي والمكثف والموتور.

</p>

</div>

`

};



result.innerHTML =
faults[fault] || `

<div class="card-icon">
🛠️
</div>

<div class="card-content">

<h2>
النتيجة
</h2>

<p>
اختر العطل من القائمة.
</p>

</div>

`;


}


</script>



</body>

</html>
