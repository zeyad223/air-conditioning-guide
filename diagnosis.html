<div class="diagnosis-card">

<h2>تشخيص أعطال التكييف</h2>


<select id="faultSelect" onchange="showFault()">

<option value="">
اختر العطل
</option>

<option value="cooling">
لا يوجد تبريد
</option>

<option value="outdoor">
الوحدة الخارجية لا تعمل
</option>

<option value="indoor">
الوحدة الداخلية لا تعمل
</option>

<option value="evaporator">
تجمد المبخر
</option>

<option value="discharge">
ثلج على خط الطرد
</option>

<option value="suction">
ثلج على خط السحب
</option>

<option value="insidefan">
المروحة الداخلية لا تعمل
</option>

<option value="outsidefan">
المروحة الخارجية لا تعمل
</option>

</select>



<div id="faultResult" class="card">

اختر العطل لعرض الأسباب

</div>


</div>



<script>

function showFault(){

let fault =
document.getElementById("faultSelect").value;


let result =
document.getElementById("faultResult");



let faults = {


cooling:`

<h2>❄️ لا يوجد تبريد</h2>

<p>
الأسباب:
<br>
- نقص شحنة الفريون.
<br>
- الكباس لا يعمل.
<br>
- سدد في مواسير الجهاز.
</p>

`,



outdoor:`

<h2>🔥 الوحدة الخارجية لا تعمل</h2>

<p>
الأسباب:
<br>
- تلف كابل الكنترول.
<br>
- تلف مكثف الكباس.
<br>
- تلف الكونتاكتور.
<br>
- تلف ريلاي الكارتة.
<br>
- عطل حساس الحرارة.
<br>
- عطل حساس الوحدة الخارجية.
</p>

`,



indoor:`

<h2>🌬️ الوحدة الداخلية لا تعمل</h2>

<p>
الأسباب:
<br>
- تلف الفيوز.
<br>
- تلف الكارتة الداخلية.
<br>
- التأكد من الكهرباء.
</p>

`,



evaporator:`

<h2>❄️ تجمد المبخر</h2>

<p>
الأسباب:
<br>
- ضعف سرعة المروحة.
<br>
- انسداد الفلاتر.
<br>
- انسداد زعانف المبخر.
<br>
- سدد في المواسير.
</p>

`,



discharge:`

<h2>🧊 ثلج على خط الطرد</h2>

<p>
الأسباب:
<br>
- نقص شحنة الفريون.
<br>
- تفويت في الكباس.
</p>

`,



suction:`

<h2>🧊 ثلج على خط السحب</h2>

<p>
الأسباب:
<br>
- سرعة المروحة الداخلية ضعيفة أو لا تعمل.
<br>
- انسداد الفلاتر.
<br>
- انسداد زعانف الكويل الداخلي.
<br>
- خفس في المواسير.
<br>
- سدد في المواسير.
</p>

`,



insidefan:`

<h2>🌀 المروحة الداخلية لا تعمل</h2>

<p>
الأسباب:
<br>
- مكثف الماتور.
<br>
- الكارتة لا تخرج كهرباء للماتور.
<br>
- تلف موتور المروحة.
</p>

`,



outsidefan:`

<h2>🌀 المروحة الخارجية لا تعمل</h2>

<p>
الأسباب:
<br>
- ريلاي الكارتة الخاص بالمروحة.
<br>
- طرف كنترول التوصيل.
<br>
- مكثف المروحة.
<br>
- تلف موتور المروحة.
</p>

`

};



result.innerHTML =
faults[fault] || "اختر العطل";

}

</script>
