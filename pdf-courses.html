<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دورات شركات التكييف PDF</title>

<style>

body{
margin:0;
font-family:Tahoma;
background:#f4f6f9;
}

header{
background:#0d6efd;
color:white;
padding:25px;
text-align:center;
}

header h1{
margin:0;
font-size:32px;
}

header p{
margin-top:10px;
font-size:18px;
}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(260px,1fr));

gap:25px;

padding:35px;

}

.card{

background:white;

border-radius:18px;

padding:30px;

box-shadow:0 5px 20px rgba(0,0,0,.15);

transition:.3s;

text-align:center;

}

.card:hover{

transform:translateY(-8px);

box-shadow:0 10px 25px rgba(0,0,0,.25);

}

.card img{

width:180px;

height:120px;

object-fit:contain;

}

.card a{

display:block;

text-decoration:none;

}

.back{

text-align:center;

padding:20px;

}

.back a{

background:#0d6efd;

color:white;

padding:12px 30px;

border-radius:8px;

text-decoration:none;

font-size:18px;

}

.back a:hover{

background:#084298;

}

</style>

</head>

<body>

<header>

<h1>دورات شركات التكييف</h1>

<p>ملفات PDF الخاصة بكل شركة</p>

</header>

</div>

</a>

</div>

</div>

</a>

</div>

</body>

</html>
