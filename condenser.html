<header>
    <h1>المكثف (Condenser)</h1>
</header>
<img src="images/condenser.jpg.jfif" alt="المكثف" class="part-image">

<div class="card">
    <h2>ما هو المكثف؟</h2>
    <p>
        المكثف موجود في الوحدة الخارجية، ووظيفته طرد الحرارة من الفريون وتحويله
        من غاز ساخن عالي الضغط إلى سائل عالي الضغط.
    </p>

    <h2>أشهر أعطال المكثف</h2>
    <ul>
        <li>اتساخ زعانف المكثف.</li>
        <li>ضعف مروحة الوحدة الخارجية.</li>
        <li>ارتفاع ضغط الطرد.</li>
        <li>ضعف التبريد.</li>
    </ul>
</div>
