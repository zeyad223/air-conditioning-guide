<img src="images/capillary.jpg.jfif" alt="الماسورة الشعرية" class="part-image">
<div class="card">
    <h2>ما هو الكابلري؟</h2>
    <p>
        الكابلري عبارة عن أنبوبة دقيقة تقوم بخفض ضغط الفريون
        قبل دخوله إلى المبخر.
    </p>

    <h2>أشهر أعطال الكابلري</h2>
    <ul>
        <li>انسداد جزئي.</li>
        <li>انسداد كامل.</li>
        <li>ضعف التبريد.</li>
        <li>تكون ثلج على المواسير.</li>
    </ul>
</div>
